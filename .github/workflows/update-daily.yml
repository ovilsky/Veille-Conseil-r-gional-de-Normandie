name: Mise à jour quotidienne de la veille

on:
  schedule:
    # 06h05 heure de Paris ≈ 05h05 UTC en hiver / 04h05 UTC en été.
    # GitHub Actions ne connaît que l'UTC : ce créneau vise un rafraîchissement
    # avant le début de journée en France, été comme hiver.
    - cron: "5 5 * * *"
  workflow_dispatch: {}  # bouton "Run workflow" manuel dans l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la collecte
        run: python3 fetch_veille_normandie.py

      - name: Publier les données mises à jour
        run: |
          git config user.name "veille-normandie-bot"
          git config user.email "actions@users.noreply.github.com"
          # git add fichier par fichier : elus-precedent.json n'existe pas
          # encore tant que la collecte des élus n'a jamais réussi une
          # première fois (ex. blocage réseau persistant) — un git add sur
          # un fichier inexistant ferait échouer toute l'étape (set -e).
          for f in veille-data.json elus-precedent.json index.html; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "  (ignoré, pas encore généré : $f)"
            fi
          done
          if git diff --cached --quiet; then
            echo "Rien de nouveau à publier aujourd'hui."
            exit 0
          fi
          git commit -m "Mise à jour automatique de la veille ($(date -u +%Y-%m-%d))"
          # pull --rebase avant push : absorbe un éventuel commit concurrent
          # (ex. déclenchement manuel pendant que le cron tournait) plutôt
          # que de faire échouer le push.
          git pull --rebase origin main
          git push
